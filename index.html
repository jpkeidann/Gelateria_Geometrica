<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, height=844, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script type="modules" src="index.js"defer></script>
  <title>Gelateria Geométrica</title>
</head>
<body>

<div class="container">

  <div class="logo"><img src="" alt=""></div>

  <h1>Gelateria<br>Geometrica</h1>
  <p class="sub">sabor doce de leite</p>

  <div class="meta-box">
    <p>meta de produção<br>selecione um</p>
  </div>


  <div class="buttons">
    <button id="1t">1 tonelada</button>
    <button id="5t">5 toneladas</button>
    <button id="12t">12 toneladas</button>
  </div>
  <select id="tamanho" class="but select-tamanho">
    <option value="400">Pequena (400g)</option>
    <option value="900" selected>Média (900g)</option>
    <option value="1700">Grande (1700g)</option>
    <option value="custom">personalizado</option>
  </select>

  
  <div class="inputs"><input type="number", placeholder="digite o valor do raio aqui", id="raio"></div>
  <div class="inputs"><input type="number", placeholder="digite o valor da altura aqui", id="altura"></div>
  
    <button class="but" id="btn_limpar">resetar</button>
    <button class="but" id="calcular">calcular</button>
  
  <div id="res1"></div>
  <div id="res2"></div>

<script>
    const buttons = document.querySelectorAll(".buttons button");
  
    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
  
        // remove o verde de todos
        buttons.forEach(b => b.classList.remove("active"));
  
        // adiciona no clicado
        btn.classList.add("active");
      });
    });
  </script>

</body>
</html>
